/**:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Gazebo RTAB-Map local-odom comparison profile.
    # The simulated IMU publishes very small gyro covariance, which can make
    # yaw-rate corrections dominate the local EKF. For this profile, keep the
    # pipeline sensor-style but use the mock encoder odometry only.
    odom0: /wheel/odometry
    odom0_config: [
      true, true, false,
      false, false, true,
      true, false, false,
      false, false, true,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    use_control: false
    print_diagnostics: true
    debug: false
