/**:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # RTAB-Map tuned encoder+IMU profile.
    #
    # The first BNO08x-like profile used IMU yaw-rate only. That keeps yaw
    # physically conservative, but yaw pose itself stays weakly observed and the
    # EKF output covariance grows. RTAB-Map then sees /odometry/local as much
    # less certain than Gazebo /odom even when the path looks visually similar.
    #
    # This tuned profile keeps yaw observable:
    # - wheel odometry owns x/y/yaw pose plus forward and yaw velocity
    # - BNO08x-like IMU reinforces yaw orientation and yaw-rate
    #
    # Later, real slip handling should raise wheel yaw covariance dynamically
    # during rotation/slip instead of removing yaw from the EKF entirely.
    odom0: /wheel/odometry
    odom0_config: [
      true, true, false,
      false, false, true,
      true, false, false,
      false, false, true,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Use the covariance-republished IMU topic, not raw Gazebo /imu/data.
    imu0: /imu/data_bno08x_like
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

    use_control: false
    print_diagnostics: true
    debug: false
