/**:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Encoder odometry owns local x/y position and forward velocity.
    # Yaw/yaw-rate are left out here so rotation is corrected mostly by IMU
    # angular velocity z. This is the first fusion profile after the
    # encoder-only Gazebo baseline.
    odom0: /wheel/odometry
    odom0_config: [
      true, true, false,
      false, false, false,
      true, false, false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Use the covariance-republished IMU topic, not raw Gazebo /imu/data.
    imu0: /imu/data_bno08x_like
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

    use_control: false
    print_diagnostics: true
    debug: false
