</g>
<g><title>첫 보드 조립·전원·기준 입력 · 12/21 – 12/23 · 계획. 12/18에 조립 필수품을 수령한다는 가정이다. 검수·조립 후 기준 입력을 MCU·PC와 대조한다.</title>
<path d="M 35 818 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="838.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">첫 보드 조립·전원·기준 입력</text>
<text x="1206.0" y="838.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">12/21 – 12/23</text>
