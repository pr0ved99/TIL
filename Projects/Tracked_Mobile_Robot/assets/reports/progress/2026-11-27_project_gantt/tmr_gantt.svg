<text x="1206.0" y="646.0" text-anchor="end" font-size="16" font-weight="500" fill="#43586b">2026.11.29 – 2027.02.26</text>
<text x="38.0" y="687.0" text-anchor="start" font-size="13" font-weight="600" fill="#546a79">작업</text>
<text x="1206.0" y="687.0" text-anchor="end" font-size="13" font-weight="600" fill="#546a79">기록일 / 계획일</text>
<rect x="309.00" y="670" width="16.20" height="388" fill="#f8fafb"/>
