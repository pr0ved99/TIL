<text x="450.8" y="687.0" text-anchor="middle" font-size="13" font-weight="600" fill="#415c6b">12월</text>
<rect x="576.30" y="670" width="251.10" height="388" fill="#f8fafb"/>
<text x="701.8" y="687.0" text-anchor="middle" font-size="13" font-weight="600" fill="#415c6b">1월</text>
<rect x="827.40" y="670" width="210.60" height="388" fill="#f0f4f7"/>
<text x="932.7" y="687.0" text-anchor="middle" font-size="13" font-weight="600" fill="#415c6b">2월</text>
<g><title>보호·실물 적층·제조 검토 · 11/29 – 12/03 · 계획. 보호 분기와 실물 적층을 대조한다. 11/30 발주 가능성을 판단하고 최종 Gerber·드릴과 BOM을 확인한다.</title>
<path d="M 35 698 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="718.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">보호·실물 적층·제조 검토</text>
<text x="1206.0" y="718.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">11/29 – 12/03</text>
<rect x="309.00" y="707.0" width="40.50" height="12" rx="3" fill="#315bbc"/>
</g>
<g><title>PCB·부품 발주 · 12/04 · 조건부. 11/30에 예상일을 다시 판단한다. PCB 제조 검토를 통과하면 사용자가 주문한다.</title>
<path d="M 35 728 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="748.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">PCB·부품 발주</text>
<text x="1206.0" y="748.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">12/04</text>
<path d="M 353.55 736.0 l 7 7 -7 7 -7 -7 z" fill="#995315"/>
</g>
<g><title>기존 NUCLEO 펌웨어·PC 기록 · 12/07 – 12/17 · 계획. 12/08부터 60초 연속 수신, 트리거 중단·복귀, 온도 평균과 PC 기록을 검증한다.</title>
<path d="M 35 758 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="778.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">기존 NUCLEO 펌웨어·PC 기록</text>
<text x="1206.0" y="778.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">12/07 – 12/17</text>
<rect x="373.80" y="767.0" width="89.10" height="12" rx="3" fill="#315bbc"/>
</g>
<g><title>PCB·핵심 부품 입고 예상 · 12/18 – 12/25 · 조건부. 12/04 발주 후 납기 2~3주를 적용한 도착 가능 구간이다. 각 품목의 실제 도착일을 기록한다.</title>
<path d="M 35 788 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="808.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">PCB·핵심 부품 입고 예상</text>
