<title id="title">TMR 전체 간트 차트</title>
<desc id="desc">위 패널은 저장소 기록으로 확인한 작업 구간, 아래 패널은 발주부터 실물 주행·인수와 예비 기간까지의 계획이다. 각 행에서 날짜를 확인할 수 있다.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
