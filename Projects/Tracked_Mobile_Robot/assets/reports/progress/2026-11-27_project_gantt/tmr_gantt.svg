<text x="35.0" y="90.0" text-anchor="start" font-size="16" font-weight="400" fill="#42606e">프로젝트 첫 기록부터 실물 자율주행·최종 인수까지   ·   기준일 2026.11.28</text>
<rect x="35" y="115" width="23" height="10" rx="3" fill="#137465" stroke="#137465"/>
<text x="68.0" y="126.0" text-anchor="start" font-size="14" font-weight="500" fill="#38505c">기록으로 확인</text>
<rect x="215" y="115" width="23" height="10" rx="3" fill="#315bbc" stroke="#315bbc"/>
