<g><title>목표·범위와 구동 구조 · 05/24 – 06/08 · 실적. STM32 하위 제어기와 궤도 플랫폼을 목표로 잡고 MDD10A를 첫 모터 드라이버로 정했다.</title>
<path d="M 35 230 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="250.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">목표·범위와 구동 구조</text>
<text x="1206.0" y="250.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">05/24 – 06/08</text>
<rect x="309.00" y="239.0" width="61.71" height="12" rx="3" fill="#137465"/>
</g>
<g><title>PC·STM32·ESP32 UART · 06/21 – 07/20 · 실적. PC 도구와 STM32 펌웨어에서 시작해 두 보드 간 명령·응답과 명령 중단 후 출력을 확인했다.</title>
<path d="M 35 260 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="280.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">PC·STM32·ESP32 UART</text>
<text x="1206.0" y="280.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">06/21 – 07/20</text>
<rect x="417.00" y="269.0" width="115.71" height="12" rx="3" fill="#137465"/>
</g>
<g><title>무부하 전원 경로와 5 V 조정 · 07/10 · 실적. 배터리·퓨즈·주전원 경로를 무부하에서 확인하고 XL4015 두 개의 출력을 조정했다.</title>
<path d="M 35 290 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="310.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">무부하 전원 경로와 5 V 조정</text>
<text x="1206.0" y="310.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">07/10</text>
<path d="M 492.21 298.0 l 7 7 -7 7 -7 -7 z" fill="#137465"/>
</g>
<g><title>차체 플레이트·전장 배치 · 07/23 – 08/26 · 실적. Onshape 배치, RevA 도면과 RevB 후보를 만들었다. 8/26에 플레이트 도착을 확인했고 도면과 도착품의 동일성은 미확인이다.</title>
<path d="M 35 320 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="340.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">차체 플레이트·전장 배치</text>
<text x="1206.0" y="340.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">07/23 – 08/26</text>
<rect x="540.43" y="329.0" width="135.00" height="12" rx="3" fill="#137465"/>
</g>
<g><title>엔코더 보정·단일 모터 구동 · 07/30 – 09/30 · 실적. 수동 회전 환산, 영구 입력 배선, 좌우 방향 보정에서 단일 모터의 명령·정지·엔코더 대조까지 진행했다.</title>
<path d="M 35 350 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="370.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">엔코더 보정·단일 모터 구동</text>
<text x="1206.0" y="370.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">07/30 – 09/30</text>
<rect x="567.43" y="359.0" width="243.00" height="12" rx="3" fill="#137465"/>
</g>
<g><title>PWM 출력·명령 유실 정지 · 08/03 – 08/28 · 실적. PWM·DIR 파형을 계측하고, 능동 DISARM과 500 ms 명령 유실 시의 정지·복구를 각각 보드에서 시험했다.</title>
<path d="M 35 380 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="400.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">PWM 출력·명령 유실 정지</text>
<text x="1206.0" y="400.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">08/03 – 08/28</text>
<rect x="582.86" y="389.0" width="100.29" height="12" rx="3" fill="#137465"/>
</g>
<g><title>물리 비상정지·전원 차단 · 08/13 – 09/23 · 실적. 회로 배치부터 릴레이·래치·복구까지 시험했다. 9/23 전원 경로 시험은 모터를 분리한 조건이다.</title>
<path d="M 35 410 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="430.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">물리 비상정지·전원 차단</text>
<text x="1206.0" y="430.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">08/13 – 09/23</text>
<rect x="621.43" y="419.0" width="162.00" height="12" rx="3" fill="#137465"/>
</g>
<g><title>Wi-Fi 지상 주행·시연 · 10/01 – 10/24 · 실적. ESP32 접속과 웹 명령을 연결해 지상 주행, 통신 유실 정지, 1 m 거리 비교, 카펫 시연 영상을 남겼다.</title>
<path d="M 35 440 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="460.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">Wi-Fi 지상 주행·시연</text>
<text x="1206.0" y="460.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">10/01 – 10/24</text>
<rect x="810.43" y="449.0" width="92.57" height="12" rx="3" fill="#137465"/>
</g>
<g><title>계측 쉴드 설계·배선 · 10/22 – 11/28 · 실적. 40부품 풋프린트·배치, 전류·온도·전압 양면 배선 및 필터 재배치. DRC·미배선·회로도 대조 오류 0건.</title>
<path d="M 35 470 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="490.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">계측 쉴드 설계·배선</text>
<text x="1206.0" y="490.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">10/22 – 11/28</text>
<rect x="891.43" y="479.0" width="146.57" height="12" rx="3" fill="#137465"/>
</g>
<g><title>기존 MVP 인수 근거 검토 · 11/19 – 11/20 · 실적. 상위 필수 요구 9개 통과·4개 부분 검증. 채택한 조건에서의 전원 차단과 남은 정량 정지 시험을 구분했다.</title>
<path d="M 35 500 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="520.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">기존 MVP 인수 근거 검토</text>
<text x="1206.0" y="520.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">11/19 – 11/20</text>
<rect x="999.43" y="509.0" width="7.71" height="12" rx="3" fill="#137465"/>
</g>
<g><title>Gazebo·LiDAR·Nav2 · 11/20 – 11/24 · 실적. TMR 모델, 가상 LiDAR와 위치 추정을 연결했다. 벽 뒤 목표에서 Nav2는 오차 4.30 cm와 접촉 0회를 기록했다.</title>
<path d="M 35 530 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="550.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">Gazebo·LiDAR·Nav2</text>
<text x="1206.0" y="550.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">11/20 – 11/24</text>
<rect x="1003.29" y="539.0" width="19.29" height="12" rx="3" fill="#137465"/>
</g>
<g><title>NUCLEO ADC·7채널 DMA · 11/24 – 11/27 · 실적. PA4 기준 입력에서 출발해 외부 여섯 핀과 내부 기준전압의 필드를 대조했다. 장시간 연속 수집과 복구는 다음 벤치 시험이다.</title>
<path d="M 35 560 H 1206" stroke="#dce4e9" stroke-width=".8"/>
<text x="38.0" y="580.4" text-anchor="start" font-size="15" font-weight="500" fill="#263d4b">NUCLEO ADC·7채널 DMA</text>
<text x="1206.0" y="580.2" text-anchor="end" font-size="15" font-weight="500" fill="#425968">11/24 – 11/27</text>
<rect x="1018.71" y="569.0" width="15.43" height="12" rx="3" fill="#137465"/>
</g>
