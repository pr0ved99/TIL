<script type="module">
  const root = document.getElementById('tmr-noise-average-retry');
  const signal = root.querySelector('#tmr-noise-signal');
  const view = root.querySelector('#tmr-noise-view');
  const readout = root.querySelector('#tmr-noise-readout');
  const provenance = JSON.parse(root.querySelector('[data-provenance]').textContent);
  const configs = Object.fromEntries(Array.from(root.querySelectorAll('[data-viz-chart]'), node => [node.dataset.key, JSON.parse(node.textContent)]));
  let chart;
  function restore(snapshot) {
    const state = snapshot?.privateContent;
    if (state?.version !== 1) return;
    if (['raw', 'bias'].includes(state.signal)) signal.value = state.signal;
    if (['detail', 'full'].includes(state.view)) view.value = state.view;
  }
  function update() {
    const key = signal.value + '-' + view.value;
    if (chart) chart.config = configs[key];
    const name = signal.value === 'raw' ? 'VRAW' : 'VRAW_BIAS';
    const delta = provenance.mean_difference_mV[signal.value];
    readout.textContent = name + ' 전체 평균 − 저장 VADC: ' + (delta >= 0 ? '+' : '') + delta.toFixed(3) + 'mV';
  }
  function save() {
    const api = window.openai;
    if (api?.setWidgetState) api.setWidgetState({
      modelContent: { source: provenance.source_file, signal: signal.value === 'raw' ? 'VRAW' : 'VRAW_BIAS', view: view.value },
      privateContent: { version: 1, signal: signal.value, view: view.value }
    }).catch(() => {});
  }
  restore(window.openai?.widgetState);
  update();
  signal.addEventListener('change', () => { update(); save(); });
  view.addEventListener('change', () => { update(); save(); });
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) { restore(event.detail.globals.widgetState); update(); }
  });
  try {
    const { mountChart } = await import('https://persistent.oaistatic.com/plugins/visualize/charts/1.2.3/element.js');
    chart = mountChart(root.querySelector('[data-viz-container]'), configs[signal.value + '-' + view.value]);
    signal.disabled = false;
    view.disabled = false;
  } catch (error) {
    const message = root.querySelector('#tmr-noise-error');
    message.textContent = '차트 구성 요소를 불러오지 못했습니다.';
    message.hidden = false;
  }
